<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>VORTEX Battle Zone</title>
<link rel="stylesheet" href="battle-zone.css">
</head>
<body>

<div id="game">
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
        <div id="topLeft">
            <div class="logo">VORTEX</div>
            <div class="hudBox">ALIVE <b id="alive">25</b></div>
            <div class="hudBox">KILLS <b id="kills">0</b></div>
        </div>

        <div id="zoneStatus">SAFE ZONE</div>

        <div id="topRight">
            <div class="weaponBox">
                <span>ASSAULT RIFLE</span>
                <b id="ammo">30 / 120</b>
            </div>
        </div>

        <div id="minimapBox">
            <canvas id="minimap"></canvas>
        </div>

        <div id="crosshair">
            <i></i><i></i><i></i><i></i>
        </div>

        <div id="bottomLeft">
            <div class="label">HEALTH</div>
            <div class="bar"><div id="health"></div></div>
            <div class="label">ARMOR</div>
            <div class="bar armor"><div id="armor"></div></div>
        </div>

        <div id="controls">
            <span>WASD MOVE</span>
            <span>MOUSE AIM</span>
            <span>CLICK SHOOT</span>
            <span>R RELOAD</span>
        </div>
    </div>

    <div id="startScreen">
        <div class="startPanel">
            <div class="bigLogo">VORTEX</div>
            <h1>BATTLE ZONE</h1>
            <p>TOP-DOWN BATTLE ROYALE</p>
            <button id="startButton">DEPLOY</button>
        </div>
    </div>

    <div id="endScreen">
        <div class="startPanel">
            <div id="endTitle">VICTORY</div>
            <p id="endText"></p>
            <button onclick="location.reload()">PLAY AGAIN</button>
        </div>
    </div>
</div>

<script src="battle-zone.js"></script>
</body>
</html>
