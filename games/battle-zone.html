<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VORTEX Battle Zone</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    width:100%;
    height:100%;
    cursor:crosshair;
}

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    color:white;
}

#top{
    position:absolute;
    top:20px;
    left:20px;
    background:rgba(8,10,10,.78);
    padding:12px 18px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:10px;
    line-height:1.7;
    backdrop-filter:blur(8px);
}

#health{
    position:absolute;
    left:25px;
    bottom:25px;
    width:230px;
    height:24px;
    background:#222;
    border-radius:6px;
    overflow:hidden;
    border:2px solid #111;
}

#healthBar{
    width:100%;
    height:100%;
    background:#29d65b;
    transition:width .2s;
}

#healthText{
    position:absolute;
    width:100%;
    text-align:center;
    top:2px;
    font-weight:bold;
}

#ammo{
    position:absolute;
    right:30px;
    bottom:30px;
    font-size:28px;
    font-weight:bold;
    text-shadow:0 2px 5px black;
}

#reload{
    position:absolute;
    right:30px;
    bottom:75px;
    pointer-events:auto;
    border:none;
    padding:12px 22px;
    border-radius:8px;
    background:#8b2cff;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

#reload:hover{
    background:#a94cff;
}

#minimap{
    position:absolute;
    top:20px;
    right:20px;
    width:210px;
    height:210px;
    background:rgba(10,10,10,.85);
    border:3px solid rgba(255,255,255,.3);
    border-radius:12px;
}

#message{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:32px;
    font-weight:bold;
    text-shadow:0 3px 10px black;
    opacity:0;
    transition:.3s;
    text-align:center;
    white-space:nowrap;
}

#phase{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    padding:10px 18px;
    border-radius:20px;
    background:rgba(5,5,5,.75);
    border:1px solid rgba(255,255,255,.2);
    font-weight:bold;
}

#dropInfo{
    position:absolute;
    bottom:35px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    font-weight:bold;
    font-size:16px;
    text-shadow:0 2px 6px black;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:20px;
    height:20px;
    transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 0 4px black;
}

#crosshair:before{
    width:2px;
    height:20px;
    left:9px;
}

#crosshair:after{
    height:2px;
    width:20px;
    top:9px;
}

#startScreen{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at center,rgba(90,30,160,.22),transparent 45%),
        rgba(3,4,6,.96);
    color:white;
}

.startBox{
    width:min(600px,90%);
    text-align:center;
    padding:50px 35px;
    border:1px solid rgba(139,44,255,.5);
    border-radius:20px;
    background:rgba(10,10,16,.9);
    box-shadow:0 0 70px rgba(139,44,255,.15);
}

.startBox h1{
    font-size:48px;
    letter-spacing:4px;
    margin-bottom:10px;
}

.startBox h1 span{
    color:#b56cff;
}

.startBox p{
    color:#aaa;
    margin:15px 0 30px;
    line-height:1.8;
}

#startButton{
    border:0;
    padding:15px 35px;
    border-radius:10px;
    background:linear-gradient(135deg,#a139ff,#6414d8);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 30px rgba(139,44,255,.3);
}

#startButton:hover{
    transform:translateY(-2px);
}

#deathScreen{
    position:fixed;
    inset:0;
    z-index:900;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.82);
}

.deathBox{
    text-align:center;
    color:white;
}

.deathBox h1{
    font-size:55px;
    color:#ff4545;
    margin-bottom:15px;
}

#restartButton{
    padding:13px 30px;
    border:0;
    border-radius:8px;
    background:#8b2cff;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

#zoneWarning{
    position:absolute;
    top:80px;
    left:50%;
    transform:translateX(-50%);
    color:#ff5555;
    font-weight:bold;
    opacity:0;
    text-shadow:0 2px 5px black;
}

@media(max-width:700px){
    #minimap{
        width:150px;
        height:150px;
    }

    #top{
        font-size:11px;
    }

    #ammo{
        font-size:22px;
    }

    #health{
        width:180px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="startScreen">
    <div class="startBox">
        <h1>VORTEX <span>BATTLE</span></h1>
        <p>
            یک مسیر برای هواپیما انتخاب می‌شود.<br>
            با <b>SPACE</b> از هواپیما بپر، چترت را باز کن و در مپ فرود بیا.
        </p>
        <button id="startButton">ENTER BATTLE</button>
    </div>
</div>

<div id="deathScreen">
    <div class="deathBox">
        <h1>ELIMINATED</h1>
        <p>You were eliminated.</p>
        <br>
        <button id="restartButton">PLAY AGAIN</button>
    </div>
</div>

<div id="hud">

    <div id="top">
        VORTEX BATTLE ZONE
        <br>
        <small>
            WASD = Move |
            Mouse = Aim |
            Click = Shoot |
            R = Reload
        </small>
    </div>

    <div id="phase">WAITING</div>

    <canvas id="minimap" width="210" height="210"></canvas>

    <div id="health">
        <div id="healthBar"></div>
        <div id="healthText">100 HP</div>
    </div>

    <button id="reload">RELOAD</button>

    <div id="ammo">30 / 120</div>

    <div id="message"></div>

    <div id="dropInfo"></div>

    <div id="crosshair"></div>

    <div id="zoneWarning">
        ⚠ OUTSIDE SAFE ZONE
    </div>

</div>

<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const minimap = document.getElementById("minimap");
const mini = minimap.getContext("2d");

const healthBar = document.getElementById("healthBar");
const healthText = document.getElementById("healthText");
const ammoText = document.getElementById("ammo");
const reloadButton = document.getElementById("reload");
const message = document.getElementById("message");

const phaseText = document.getElementById("phase");
const dropInfo = document.getElementById("dropInfo");
const zoneWarning = document.getElementById("zoneWarning");

const startScreen = document.getElementById("startScreen");
const startButton = document.getElementById("startButton");

const deathScreen = document.getElementById("deathScreen");
const restartButton = document.getElementById("restartButton");

function resize(){

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

}

window.addEventListener("resize",resize);
resize();


/* =========================================================
   WORLD
========================================================= */

const WORLD_WIDTH = 5000;
const WORLD_HEIGHT = 5000;

const keys = {};

let mouseX = canvas.width/2;
let mouseY = canvas.height/2;
let mouseDown = false;

document.addEventListener("keydown",e=>{

    const key=e.key.toLowerCase();

    keys[key]=true;

    if(key==="r"){
        reload();
    }

    if(e.code==="Space"){
        e.preventDefault();

        if(gameState==="plane"){
            jumpFromPlane();
        }
        else if(gameState==="fall"){
            openParachute();
        }
    }

});

document.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

canvas.addEventListener("mousemove",e=>{

    mouseX=e.clientX;
    mouseY=e.clientY;

});

canvas.addEventListener("mousedown",e=>{

    if(e.button===0){
        mouseDown=true;
    }

});

document.addEventListener("mouseup",e=>{

    if(e.button===0){
        mouseDown=false;
    }

});


/* =========================================================
   GAME STATE
========================================================= */

let gameState="waiting";

let gameStarted=false;

let gameOver=false;


/*
waiting
plane
fall
parachute
playing
dead
*/

let stateTimer=0;


/* =========================================================
   PLAYER
========================================================= */

const player={

    x:WORLD_WIDTH/2,
    y:WORLD_HEIGHT/2,

    speed:4.2,

    angle:0,

    hp:100,

    ammo:30,

    reserve:120,

    alive:true,

    landed:false,

    altitude:0,

    parachute:false,

    fallingSpeed:0,

    airControl:3.5

};


/* =========================================================
   CAMERA
========================================================= */

const camera={
    x:0,
    y:0
};


/* =========================================================
   MAP
========================================================= */

const buildings=[];
const trees=[];
const rocks=[];
const crates=[];
const roads=[];
const lakes=[];
const bushes=[];


/* =========================================================
   RANDOM
========================================================= */

function random(min,max){

    return Math.random()*(max-min)+min;

}

function randomInt(min,max){

    return Math.floor(random(min,max+1));

}


/* =========================================================
   ROADS
========================================================= */

roads.push({

    x:0,
    y:2250,
    w:WORLD_WIDTH,
    h:500

});

roads.push({

    x:2250,
    y:0,
    w:500,
    h:WORLD_HEIGHT

});


/* =========================================================
   LAKES
========================================================= */

for(let i=0;i<4;i++){

    lakes.push({

        x:random(400,WORLD_WIDTH-700),
        y:random(400,WORLD_HEIGHT-700),

        w:random(250,650),
        h:random(180,500)

    });

}


/* =========================================================
   BUILDINGS
========================================================= */

for(let i=0;i<75;i++){

    let w=random(100,280);
    let h=random(100,230);

    let x=random(100,WORLD_WIDTH-w-100);
    let y=random(100,WORLD_HEIGHT-h-100);

    if(
        x<2750 &&
        x+w>2250 &&
        y<2750 &&
        y+h>2250
    ){
        i--;
        continue;
    }

    buildings.push({

        x,
        y,
        w,
        h,

        roof:Math.random()>.5,

        doorSide:randomInt(0,3),

        interior:false

    });

}


/* =========================================================
   TREES
========================================================= */

for(let i=0;i<750;i++){

    trees.push({

        x:random(50,WORLD_WIDTH-50),
        y:random(50,WORLD_HEIGHT-50),

        size:random(12,30),

        type:randomInt(0,2)

    });

}


/* =========================================================
   ROCKS
========================================================= */

for(let i=0;i<250;i++){

    rocks.push({

        x:random(50,WORLD_WIDTH-50),
        y:random(50,WORLD_HEIGHT-50),

        size:random(8,28)

    });

}


/* =========================================================
   CRATES
========================================================= */

for(let i=0;i<180;i++){

    crates.push({

        x:random(100,WORLD_WIDTH-100),
        y:random(100,WORLD_HEIGHT-100)

    });

}


/* =========================================================
   BUSHES
========================================================= */

for(let i=0;i<500;i++){

    bushes.push({

        x:random(30,WORLD_WIDTH-30),
        y:random(30,WORLD_HEIGHT-30),

        size:random(5,14)

    });

}


/* =========================================================
   ENEMIES
========================================================= */

const enemies=[];

for(let i=0;i<25;i++){

    enemies.push({

        x:random(300,WORLD_WIDTH-300),
        y:random(300,WORLD_HEIGHT-300),

        angle:random(0,Math.PI*2),

        hp:100,

        speed:random(.7,1.2),

        cooldown:randomInt(0,120),

        alive:true

    });

}


/* =========================================================
   BULLETS
========================================================= */

const bullets=[];


/* =========================================================
   ENEMY BULLETS
========================================================= */

const enemyBullets=[];


/* =========================================================
   SAFE ZONE
========================================================= */

const safeZone={

    x:WORLD_WIDTH/2,
    y:WORLD_HEIGHT/2,

    radius:2200,

    targetRadius:2200,

    shrinkSpeed:.08

};

let zoneDamageTimer=0;


/* =========================================================
   PLANE
========================================================= */

const plane={

    active:false,

    x:0,
    y:0,

    startX:0,
    startY:0,

    endX:0,
    endY:0,

    angle:0,

    progress:0,

    speed:0.0018,

    length:800

};


/* =========================================================
   DROP POSITION
========================================================= */

let dropX=0;
let dropY=0;


/* =========================================================
   CREATE PLANE ROUTE
========================================================= */

function createPlaneRoute(){

    const side=randomInt(0,3);

    if(side===0){

        plane.startX=-500;
        plane.startY=random(500,WORLD_HEIGHT-500);

        plane.endX=WORLD_WIDTH+500;
        plane.endY=random(500,WORLD_HEIGHT-500);

    }

    else if(side===1){

        plane.startX=WORLD_WIDTH+500;
        plane.startY=random(500,WORLD_HEIGHT-500);

        plane.endX=-500;
        plane.endY=random(500,WORLD_HEIGHT-500);

    }

    else if(side===2){

        plane.startX=random(500,WORLD_WIDTH-500);
        plane.startY=-500;

        plane.endX=random(500,WORLD_WIDTH-500);
        plane.endY=WORLD_HEIGHT+500;

    }

    else{

        plane.startX=random(500,WORLD_WIDTH-500);
        plane.startY=WORLD_HEIGHT+500;

        plane.endX=random(500,WORLD_WIDTH-500);
        plane.endY=-500;

    }

    plane.x=plane.startX;
    plane.y=plane.startY;

    plane.progress=0;

    plane.angle=Math.atan2(
        plane.endY-plane.startY,
        plane.endX-plane.startX
    );

}


/* =========================================================
   START GAME
========================================================= */

startButton.addEventListener("click",startGame);

function startGame(){

    startScreen.style.display="none";

    gameStarted=true;
    gameOver=false;

    player.alive=true;
    player.hp=100;
    player.ammo=30;
    player.reserve=120;

    player.landed=false;
    player.parachute=false;

    createPlaneRoute();

    gameState="plane";

    plane.active=true;

    phaseText.textContent="✈ PLANE";

    dropInfo.textContent="SPACE = JUMP FROM PLANE";

}


/* =========================================================
   JUMP FROM PLANE
========================================================= */

function jumpFromPlane(){

    if(gameState!=="plane") return;

    gameState="fall";

    player.x=plane.x;
    player.y=plane.y;

    dropX=player.x;
    dropY=player.y;

    player.altitude=1000;

    player.parachute=false;

    player.fallingSpeed=8;

    phaseText.textContent="⬇ FREE FALL";

    dropInfo.textContent=
        "FREE FALL • SPACE = OPEN PARACHUTE";

}


/* =========================================================
   PARACHUTE
========================================================= */

function openParachute(){

    if(gameState!=="fall") return;

    if(player.altitude<100) return;

    player.parachute=true;

    gameState="parachute";

    phaseText.textContent="🪂 PARACHUTE";

    dropInfo.textContent=
        "WASD = CONTROL LANDING";

}


/* =========================================================
   LAND
========================================================= */

function landPlayer(){

    player.altitude=0;

    player.parachute=false;

    player.landed=true;

    gameState="playing";

    phaseText.textContent="🎯 BATTLE";

    dropInfo.textContent="";

}


/* =========================================================
   PLANE UPDATE
========================================================= */

function updatePlane(){

    if(!plane.active) return;

    plane.progress+=plane.speed;

    if(plane.progress>=1){

        plane.progress=1;

        plane.active=false;

        if(gameState==="plane"){

            jumpFromPlane();

        }

    }

    plane.x=
        plane.startX+
        (plane.endX-plane.startX)*plane.progress;

    plane.y=
        plane.startY+
        (plane.endY-plane.startY)*plane.progress;

}


/* =========================================================
   AIR UPDATE
========================================================= */

function updateAir(){

    if(gameState!=="fall" && gameState!=="parachute"){
        return;
    }

    let dx=0;
    let dy=0;

    if(keys["w"])dy--;
    if(keys["s"])dy++;
    if(keys["a"])dx--;
    if(keys["d"])dx++;

    if(dx!==0 || dy!==0){

        const len=Math.hypot(dx,dy);

        dx/=len;
        dy/=len;

        player.x+=dx*player.airControl;
        player.y+=dy*player.airControl;

    }

    player.x=Math.max(20,Math.min(
        WORLD_WIDTH-20,
        player.x
    ));

    player.y=Math.max(20,Math.min(
        WORLD_HEIGHT-20,
        player.y
    ));

    if(gameState==="fall"){

        player.altitude-=player.fallingSpeed;

        player.fallingSpeed+=.08;

        if(player.altitude<=150){

            openParachute();

        }

    }

    else if(gameState==="parachute"){

        player.altitude-=2.2;

        if(player.altitude<=0){

            landPlayer();

        }

    }

}


/* =========================================================
   RELOAD
========================================================= */

let reloading=false;

function reload(){

    if(!player.alive) return;

    if(gameState!=="playing") return;

    if(reloading)return;

    if(player.ammo>=30)return;

    if(player.reserve<=0)return;

    reloading=true;

    message.textContent="RELOADING...";
    message.style.opacity=1;

    setTimeout(()=>{

        const needed=30-player.ammo;

        const amount=Math.min(
            needed,
            player.reserve
        );

        player.ammo+=amount;

        player.reserve-=amount;

        reloading=false;

        message.style.opacity=0;

    },1000);

}

reloadButton.addEventListener("click",reload);


/* =========================================================
   SHOOT
========================================================= */

let lastShot=0;

function shoot(){

    if(gameState!=="playing")return;

    if(reloading)return;

    if(player.ammo<=0){

        reload();

        return;

    }

    const now=Date.now();

    if(now-lastShot<120)return;

    lastShot=now;

    player.ammo--;

    bullets.push({

        x:player.x,
        y:player.y,

        angle:player.angle,

        speed:18,

        life:100

    });

}


/* =========================================================
   COLLISION WITH BUILDINGS
========================================================= */

function circleRectCollision(cx,cy,r,rect){

    const closestX=Math.max(
        rect.x,
        Math.min(cx,rect.x+rect.w)
    );

    const closestY=Math.max(
        rect.y,
        Math.min(cy,rect.y+rect.h)
    );

    const dx=cx-closestX;
    const dy=cy-closestY;

    return dx*dx+dy*dy<r*r;

}


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(){

    if(gameState!=="playing"){

        updateCamera();

        return;

    }

    let dx=0;
    let dy=0;

    if(keys["w"])dy--;
    if(keys["s"])dy++;
    if(keys["a"])dx--;
    if(keys["d"])dx++;

    if(dx!==0 || dy!==0){

        const len=Math.hypot(dx,dy);

        dx/=len;
        dy/=len;

        const oldX=player.x;
        const oldY=player.y;

        player.x+=dx*player.speed;
        player.y+=dy*player.speed;

        let blocked=false;

        for(const b of buildings){

            if(circleRectCollision(
                player.x,
                player.y,
                16,
                b
            )){

                blocked=true;
                break;

            }

        }

        if(blocked){

            player.x=oldX;
            player.y=oldY;

        }

    }

    player.x=Math.max(
        25,
        Math.min(WORLD_WIDTH-25,player.x)
    );

    player.y=Math.max(
        25,
        Math.min(WORLD_HEIGHT-25,player.y)
    );

    updateCamera();

    player.angle=Math.atan2(
        mouseY-canvas.height/2,
        mouseX-canvas.width/2
    );

    if(mouseDown){

        shoot();

    }

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

    camera.x=player.x-canvas.width/2;
    camera.y=player.y-canvas.height/2;

    camera.x=Math.max(
        0,
        Math.min(
            WORLD_WIDTH-canvas.width,
            camera.x
        )
    );

    camera.y=Math.max(
        0,
        Math.min(
            WORLD_HEIGHT-canvas.height,
            camera.y
        )
    );

}


/* =========================================================
   BULLETS
========================================================= */

function updateBullets(){

    for(let i=bullets.length-1;i>=0;i--){

        const bullet=bullets[i];

        bullet.x+=
            Math.cos(bullet.angle)*
            bullet.speed;

        bullet.y+=
            Math.sin(bullet.angle)*
            bullet.speed;

        bullet.life--;

        let remove=false;

        for(const b of buildings){

            if(
                bullet.x>b.x &&
                bullet.x<b.x+b.w &&
                bullet.y>b.y &&
                bullet.y<b.y+b.h
            ){

                remove=true;
                break;

            }

        }

        for(const enemy of enemies){

            if(!enemy.alive)continue;

            const distance=Math.hypot(
                bullet.x-enemy.x,
                bullet.y-enemy.y
            );

            if(distance<24){

                enemy.hp-=50;

                if(enemy.hp<=0){

                    enemy.hp=0;
                    enemy.alive=false;

                }

                remove=true;

                break;

            }

        }

        if(
            bullet.life<=0 ||
            remove ||
            bullet.x<0 ||
            bullet.y<0 ||
            bullet.x>WORLD_WIDTH ||
            bullet.y>WORLD_HEIGHT
        ){

            bullets.splice(i,1);

        }

    }

}


/* =========================================================
   ENEMY SHOOTING
========================================================= */

function enemyShoot(enemy){

    const angle=Math.atan2(
        player.y-enemy.y,
        player.x-enemy.x
    );

    enemyBullets.push({

        x:enemy.x,
        y:enemy.y,

        angle:angle,

        speed:7,

        life:100

    });

}


/* =========================================================
   ENEMY UPDATE
========================================================= */

function updateEnemies(){

    if(gameState!=="playing")return;

    for(const enemy of enemies){

        if(!enemy.alive)continue;

        const dx=player.x-enemy.x;
        const dy=player.y-enemy.y;

        const distance=Math.hypot(dx,dy);

        enemy.angle=Math.atan2(dy,dx);

        enemy.cooldown--;

        if(distance>300){

            enemy.x+=
                Math.cos(enemy.angle)*
                enemy.speed;

            enemy.y+=
                Math.sin(enemy.angle)*
                enemy.speed;

        }

        else if(distance<700){

            if(enemy.cooldown<=0){

                enemyShoot(enemy);

                enemy.cooldown=randomInt(70,140);

            }

        }

        enemy.x=Math.max(
            20,
            Math.min(WORLD_WIDTH-20,enemy.x)
        );

        enemy.y=Math.max(
            20,
            Math.min(WORLD_HEIGHT-20,enemy.y)
        );

    }

}


/* =========================================================
   ENEMY BULLETS
========================================================= */

function updateEnemyBullets(){

    if(gameState!=="playing")return;

    for(let i=enemyBullets.length-1;i>=0;i--){

        const bullet=enemyBullets[i];

        bullet.x+=
            Math.cos(bullet.angle)*
            bullet.speed;

        bullet.y+=
            Math.sin(bullet.angle)*
            bullet.speed;

        bullet.life--;

        let hitWall=false;

        for(const b of buildings){

            if(
                bullet.x>b.x &&
                bullet.x<b.x+b.w &&
                bullet.y>b.y &&
                bullet.y<b.y+b.h
            ){

                hitWall=true;
                break;

            }

        }

        const distance=Math.hypot(
            bullet.x-player.x,
            bullet.y-player.y
        );

        if(distance<18){

            player.hp-=12;

            hitWall=true;

            if(player.hp<=0){

                player.hp=0;

                killPlayer();

            }

        }

        if(
            bullet.life<=0 ||
            hitWall
        ){

            enemyBullets.splice(i,1);

        }

    }

}


/* =========================================================
   SAFE ZONE
========================================================= */

function updateZone(){

    if(gameState!=="playing")return;

    safeZone.targetRadius=850;

    if(safeZone.radius>safeZone.targetRadius){

        safeZone.radius-=safeZone.shrinkSpeed;

    }

    const distance=Math.hypot(
        player.x-safeZone.x,
        player.y-safeZone.y
    );

    if(distance>safeZone.radius){

        zoneWarning.style.opacity=1;

        zoneDamageTimer++;

        if(zoneDamageTimer>20){

            player.hp-=1;

            zoneDamageTimer=0;

        }

        if(player.hp<=0){

            player.hp=0;

            killPlayer();

        }

    }
    else{

        zoneWarning.style.opacity=0;
        zoneDamageTimer=0;

    }

}


/* =========================================================
   PLAYER DEATH
========================================================= */

function killPlayer(){

    if(!player.alive)return;

    player.alive=false;

    gameState="dead";

    phaseText.textContent="ELIMINATED";

    deathScreen.style.display="flex";

}

function drawWorld(){

    ctx.fillStyle="#66755a";

    ctx.fillRect(
        0,
        0,
        WORLD_WIDTH,
        WORLD_HEIGHT
    );


    /* grass patches */

    for(let x=0;x<WORLD_WIDTH;x+=80){

        for(let y=0;y<WORLD_HEIGHT;y+=80){

            const variation=
                ((x*17+y*31)%100)/100;

            ctx.fillStyle=
                variation>.5
                ?"rgba(45,80,43,.18)"
                :"rgba(100,130,70,.10)";

            ctx.fillRect(
                x,
                y,
                80,
                80
            );

        }

    }


    /* lakes */

    for(const lake of lakes){

        ctx.fillStyle="#315c70";

        ctx.beginPath();

        ctx.ellipse(
            lake.x-camera.x+lake.w/2,
            lake.y-camera.y+lake.h/2,
            lake.w/2,
            lake.h/2,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.strokeStyle="#6e9baa";
        ctx.lineWidth=4;

        ctx.stroke();

    }


    /* roads */

    ctx.fillStyle="#30363a";

    for(const road of roads){

        ctx.fillRect(
            road.x-camera.x,
            road.y-camera.y,
            road.w,
            road.h
        );

    }


    /* road edges */

    ctx.strokeStyle="#777d7c";
    ctx.lineWidth=4;
    ctx.setLineDash([]);

    ctx.beginPath();

    ctx.moveTo(
        0-camera.x,
        2250-camera.y
    );
