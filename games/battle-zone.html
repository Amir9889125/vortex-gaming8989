<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VORTEX Battle Zone</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    color:white;
}

#top{
    position:absolute;
    top:20px;
    left:20px;
    background:rgba(8,8,8,.8);
    padding:12px 18px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.15);
}

#status{
    position:absolute;
    top:100px;
    left:20px;
    background:rgba(8,8,8,.75);
    padding:10px 15px;
    border-radius:8px;
}

#health{
    position:absolute;
    bottom:25px;
    left:25px;
    width:230px;
    height:24px;
    background:#222;
    border:2px solid #111;
    border-radius:6px;
    overflow:hidden;
}

#healthBar{
    width:100%;
    height:100%;
    background:#29d65b;
}

#healthText{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
}

#ammo{
    position:absolute;
    right:30px;
    bottom:30px;
    font-size:28px;
    font-weight:bold;
    text-shadow:0 2px 6px #000;
}

#reload{
    position:absolute;
    right:30px;
    bottom:75px;
    pointer-events:auto;
    border:0;
    padding:11px 22px;
    border-radius:8px;
    background:#8b2cff;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

#reload:hover{
    background:#a94cff;
}

#minimap{
    position:absolute;
    right:20px;
    top:20px;
    width:190px;
    height:190px;
    background:#30382d;
    border:3px solid rgba(255,255,255,.25);
    border-radius:10px;
}

#jump{
    position:absolute;
    left:50%;
    bottom:45px;
    transform:translateX(-50%);
    padding:15px 35px;
    border:0;
    border-radius:10px;
    background:#ff9d21;
    color:#111;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    pointer-events:auto;
}

#jump:hover{
    background:#ffb44f;
}

#parachute{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:22px;
    font-weight:bold;
    text-align:center;
    text-shadow:0 3px 10px #000;
}

#message{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:35px;
    font-weight:bold;
    text-shadow:0 3px 15px #000;
    text-align:center;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

    <div id="top">
        <b>VORTEX BATTLE ZONE</b>
        <br>
        <small>WASD = Move | Mouse = Aim | Click = Shoot</small>
    </div>

    <div id="status">
        وضعیت: <b id="stateText">هواپیما</b>
    </div>

    <canvas id="minimap" width="190" height="190"></canvas>

    <button id="jump">SPACE — پرش</button>

    <div id="parachute"></div>

    <div id="health">
        <div id="healthBar"></div>
        <div id="healthText">100 HP</div>
    </div>

    <button id="reload">RELOAD</button>

    <div id="ammo">30 / 120</div>

    <div id="message"></div>

</div>

<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const minimap=document.getElementById("minimap");
const mini=minimap.getContext("2d");

function resize(){
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
}

window.addEventListener("resize",resize);
resize();


/* =====================================================
   WORLD
===================================================== */

const WORLD_WIDTH=5000;
const WORLD_HEIGHT=5000;


/* =====================================================
   GAME STATE
===================================================== */

let gameState="plane";

/*
plane
falling
parachute
landed
*/


/* =====================================================
   PLAYER
===================================================== */

const player={
    x:2500,
    y:2500,

    speed:4,

    angle:0,

    hp:100,

    ammo:30,
    reserve:120,

    altitude:1200,

    vx:0,
    vy:0,

    parachute:false
};


/* =====================================================
   CAMERA
===================================================== */

const camera={
    x:0,
    y:0
};


/* =====================================================
   CONTROLS
===================================================== */

const keys={};

let mouseX=canvas.width/2;
let mouseY=canvas.height/2;

let mouseDown=false;

document.addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()]=true;

    if(e.code==="Space"){
        jump();
    }

    if(e.key.toLowerCase()==="r"){
        reload();
    }
});

document.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

canvas.addEventListener("mousemove",e=>{

    mouseX=e.clientX;
    mouseY=e.clientY;

});

canvas.addEventListener("mousedown",()=>{
    mouseDown=true;
});

document.addEventListener("mouseup",()=>{
    mouseDown=false;
});


/* =====================================================
   JUMP BUTTON
===================================================== */

document.getElementById("jump").addEventListener("click",jump);


/* =====================================================
   MAP
===================================================== */

const buildings=[];
const trees=[];
const rocks=[];
const crates=[];

function random(min,max){
    return Math.random()*(max-min)+min;
}


/* Roads */

const roads=[
    {
        x:0,
        y:2350,
        w:WORLD_WIDTH,
        h:300
    },
    {
        x:2350,
        y:0,
        w:300,
        h:WORLD_HEIGHT
    }
];


/* Buildings */

for(let i=0;i<55;i++){

    const w=random(100,250);
    const h=random(100,220);

    const x=random(100,WORLD_WIDTH-w-100);
    const y=random(100,WORLD_HEIGHT-h-100);

    buildings.push({
        x,
        y,
        w,
        h
    });

}


/* Trees */

for(let i=0;i<600;i++){

    trees.push({
        x:random(50,WORLD_WIDTH-50),
        y:random(50,WORLD_HEIGHT-50),
        size:random(12,28)
    });

}


/* Rocks */

for(let i=0;i<200;i++){

    rocks.push({
        x:random(50,WORLD_WIDTH-50),
        y:random(50,WORLD_HEIGHT-50),
        size:random(8,25)
    });

}


/* Crates */

for(let i=0;i<150;i++){

    crates.push({
        x:random(100,WORLD_WIDTH-100),
        y:random(100,WORLD_HEIGHT-100)
    });

}


/* =====================================================
   AIRPLANE
===================================================== */

const plane={
    x:-800,
    y:1300,

    speed:8,

    active:true
};


/* =====================================================
   JUMP
===================================================== */

function jump(){

    if(gameState!=="plane"){
        return;
    }

    gameState="falling";

    player.x=plane.x;
    player.y=plane.y;

    player.altitude=1200;

    player.vx=0;
    player.vy=1;

    document.getElementById("jump").style.display="none";

    document.getElementById("stateText").textContent="در حال سقوط";

}


/* =====================================================
   PARACHUTE
===================================================== */

function openParachute(){

    if(gameState!=="falling"){
        return;
    }

    if(player.altitude>500){
        return;
    }

    player.parachute=true;

    gameState="parachute";

    document.getElementById("stateText").textContent="چتر باز است";

}


/* =====================================================
   LAND
===================================================== */

function land(){

    gameState="landed";

    player.altitude=0;

    player.parachute=false;

    document.getElementById("stateText").textContent="روی زمین";

}


/* =====================================================
   FALLING
===================================================== */

function updateAirDrop(){

    if(gameState==="falling"){

        player.altitude-=10;

        player.x+=player.vx;
        player.y+=player.vy;

        player.vy+=0.15;

        /*
        باز کردن خودکار چتر
        */

        if(player.altitude<=500){

            openParachute();

        }

    }


    if(gameState==="parachute"){

        player.altitude-=3;

        /*
        کنترل حرکت در هوا
        */

        if(keys["w"]){
            player.y-=3;
        }

        if(keys["s"]){
            player.y+=3;
        }

        if(keys["a"]){
            player.x-=3;
        }

        if(keys["d"]){
            player.x+=3;
        }

        if(player.altitude<=0){

            land();

        }

    }


    player.x=Math.max(
        50,
        Math.min(WORLD_WIDTH-50,player.x)
    );

    player.y=Math.max(
        50,
        Math.min(WORLD_HEIGHT-50,player.y)
    );

}


/* =====================================================
   AIRPLANE UPDATE
===================================================== */

function updatePlane(){

    if(gameState!=="plane"){
        return;
    }

    plane.x+=plane.speed;

    /*
    هواپیما از مپ عبور می‌کند
    */

    if(plane.x>WORLD_WIDTH+800){

        plane.x=-800;

    }

}


/* =====================================================
   DRAW AIRPLANE
===================================================== */

function drawPlane(){

    if(gameState!=="plane"){
        return;
    }

    const x=plane.x-camera.x;
    const y=plane.y-camera.y;

    ctx.save();

    ctx.translate(x,y);

    /*
    بدنه
    */

    ctx.fillStyle="#e5e5e5";

    ctx.fillRect(
        -80,
        -18,
        160,
        36
    );

    /*
    دم
    */

    ctx.fillStyle="#bfc4ca";

    ctx.beginPath();

    ctx.moveTo(-80,-18);
    ctx.lineTo(-105,-50);
    ctx.lineTo(-70,-15);
    ctx.fill();

    /*
    بال
    */

    ctx.fillStyle="#c7ccd1";

    ctx.fillRect(
        -25,
        -75,
        50,
        150
    );

    /*
    کابین
    */

    ctx.fillStyle="#273d52";

    ctx.fillRect(
        45,
        -13,
        25,
        26
    );

    ctx.restore();

}


/* =====================================================
   DRAW PARACHUTE
===================================================== */

function drawParachute(){

    if(gameState!=="parachute"){
        return;
    }

    const x=player.x-camera.x;
    const y=player.y-camera.y;

    ctx.save();

    /*
    چتر
    */

    ctx.fillStyle="#e63e55";

    ctx.beginPath();

    ctx.arc(
        x,
        y-100,
        65,
        Math.PI,
        0
    );

    ctx.fill();

    /*
    نخ‌ها
    */

    ctx.strokeStyle="white";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(x-60,y-100);
    ctx.lineTo(x-10,y);

    ctx.moveTo(x+60,y-100);
    ctx.lineTo(x+10,y);

    ctx.stroke();

    ctx.restore();

}


/* =====================================================
   HUMAN PLAYER
===================================================== */

function drawHuman(x,y,angle,color="#358cff"){

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(angle);

    /*
    Shadow
    */

    ctx.fillStyle="rgba(0,0,0,.35)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        12,
        18,
        10,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
    Legs
    */

    ctx.fillStyle="#20242c";

    ctx.fillRect(-10,5,7,18);
    ctx.fillRect(3,5,7,18);


    /*
    Body
    */

    ctx.fillStyle=color;

    ctx.fillRect(
        -13,
        -10,
        26,
        25
    );


    /*
    Arms
    */

    ctx.fillStyle="#d2a17b";

    ctx.fillRect(-19,-7,7,18);
    ctx.fillRect(12,-7,7,18);


    /*
    Head
    */

    ctx.beginPath();

    ctx.arc(
        0,
        -22,
        10,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
    Hair
    */

    ctx.fillStyle="#202020";

    ctx.beginPath();

    ctx.arc(
        0,
        -25,
        10,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();


    /*
    Gun
    */

    ctx.fillStyle="#171717";

    ctx.fillRect(
        10,
        -4,
        25,
        6
    );

    ctx.restore();

}


/* =====================================================
   DRAW PLAYER
===================================================== */

function drawPlayer(){

    if(gameState==="plane"){
        return;
    }

    drawHuman(
        player.x-camera.x,
        player.y-camera.y,
        player.angle,
        "#358cff"
    );

}


/* =====================================================
   DRAW WORLD
===================================================== */

function drawWorld(){

    ctx.fillStyle="#657259";

    ctx.fillRect(
        0,
        0,
        WORLD_WIDTH,
        WORLD_HEIGHT
    );


    /*
    Grass details
    */

    ctx.fillStyle="rgba(30,60,30,.35)";

    for(let x=0;x<WORLD_WIDTH;x+=100){

        for(let y=0;y<WORLD_HEIGHT;y+=100){

            ctx.fillRect(
                x-camera.x,
                y-camera.y,
                2,
                2
            );

        }

    }


    /*
    Roads
    */

    ctx.fillStyle="#30343a";

    for(const road of roads){

        ctx.fillRect(
            road.x-camera.x,
            road.y-camera.y,
            road.w,
            road.h
        );

    }


    /*
    Road lines
    */

    ctx.strokeStyle="#d5bd4d";
    ctx.lineWidth=5;
    ctx.setLineDash([40,35]);

    ctx.beginPath();

    ctx.moveTo(
        0-camera.x,
        2500-camera.y
    );

    ctx.lineTo(
        WORLD_WIDTH-camera.x,
        2500-camera.y
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        2500-camera.x,
        0-camera.y
    );

    ctx.lineTo(
        2500-camera.x,
        WORLD_HEIGHT-camera.y
    );

    ctx.stroke();

    ctx.setLineDash([]);


    /*
    Buildings
    */

    for(const b of buildings){

        ctx.fillStyle="#292d30";

        ctx.fillRect(
            b.x-camera.x,
            b.y-camera.y,
            b.w,
            b.h
        );

        ctx.fillStyle="#17191b";

        ctx.fillRect(
            b.x-camera.x+8,
            b.y-camera.y+8,
            b.w-16,
            b.h-16
        );


        /*
        Windows
        */

        ctx.fillStyle="#9ca
