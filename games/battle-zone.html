<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VORTEX Battle Zone</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#101510;
font-family:Arial,sans-serif
}

#game{
display:block;
width:100%;
height:100%;
cursor:crosshair
}

#hud{
position:fixed;
inset:0;
pointer-events:none;
color:white
}

#top{
position:absolute;
top:18px;
left:18px;
padding:12px 16px;
background:rgba(8,12,10,.82);
border:1px solid rgba(255,255,255,.15);
border-radius:10px;
line-height:1.6
}

#minimap{
position:absolute;
top:18px;
right:18px;
width:190px;
height:190px;
border:3px solid rgba(255,255,255,.35);
border-radius:10px;
background:#46543c
}

#health{
position:absolute;
left:25px;
bottom:25px;
width:240px;
height:25px;
background:#222;
border:2px solid #111;
border-radius:7px;
overflow:hidden
}

#healthBar{
height:100%;
width:100%;
background:#29d65b
}

#healthText{
position:absolute;
inset:0;
text-align:center;
line-height:21px;
font-weight:bold
}

#ammo{
position:absolute;
right:30px;
bottom:30px;
font-size:28px;
font-weight:bold;
text-shadow:0 2px 5px #000
}

#reload{
position:absolute;
right:30px;
bottom:78px;
pointer-events:auto;
padding:11px 20px;
border:0;
border-radius:8px;
background:#2878ff;
color:#fff;
font-weight:bold;
cursor:pointer
}

#message{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
font-size:34px;
font-weight:bold;
text-shadow:0 3px 12px #000;
opacity:0;
text-align:center
}

#startScreen{
position:fixed;
inset:0;
z-index:20;
background:
linear-gradient(rgba(5,10,7,.72),rgba(5,10,7,.9)),
radial-gradient(circle at center,#315b35,#071008);
display:flex;
align-items:center;
justify-content:center;
color:white
}

.startBox{
text-align:center;
background:rgba(10,16,12,.92);
padding:45px;
border:1px solid rgba(255,255,255,.2);
border-radius:18px;
box-shadow:0 20px 80px #000
}

.startBox h1{
font-size:42px;
margin-bottom:10px
}

.startBox p{
color:#aaa;
margin-bottom:25px
}

#startButton{
padding:14px 35px;
border:0;
border-radius:9px;
background:#2878ff;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="startScreen">
<div class="startBox">
<h1>VORTEX BATTLE ZONE</h1>
<p>Top-Down Battle Royale</p>
<button id="startButton">START GAME</button>
</div>
</div>

<div id="hud">

<div id="top">
<b>VORTEX BATTLE ZONE</b>
<br>
<small>WASD Move • Mouse Aim • Click Shoot • R Reload</small>
</div>

<canvas id="minimap" width="190" height="190"></canvas>

<div id="health">
<div id="healthBar"></div>
<div id="healthText">100 HP</div>
</div>

<button id="reload">RELOAD</button>

<div id="ammo">30 / 120</div>

<div id="message"></div>

</div>

<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const minimap=document.getElementById("minimap");
const mini=minimap.getContext("2d");

function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}

window.addEventListener("resize",resize);
resize();


/* =====================================================
   WORLD
===================================================== */

const WORLD_WIDTH=5000;
const WORLD_HEIGHT=5000;

const keys={};

let mouseX=canvas.width/2;
let mouseY=canvas.height/2;
let mouseDown=false;

document.addEventListener("keydown",e=>{

keys[e.key.toLowerCase()]=true;

if(e.key.toLowerCase()==="r")
reload();

});

document.addEventListener("keyup",e=>{
keys[e.key.toLowerCase()]=false;
});

canvas.addEventListener("mousemove",e=>{
mouseX=e.clientX;
mouseY=e.clientY;
});

canvas.addEventListener("mousedown",()=>{
mouseDown=true;
});

document.addEventListener("mouseup",()=>{
mouseDown=false;
});


/* =====================================================
   HELPERS
===================================================== */

function random(min,max){
return Math.random()*(max-min)+min;
}

function distance(a,b,c,d){
return Math.hypot(a-c,b-d);
}


/* =====================================================
   PLAYER
===================================================== */

const player={
x:2500,
y:2500,
speed:4,
angle:0,
hp:100,
ammo:30,
reserve:120,
alive:true
};


/* =====================================================
   CAMERA
===================================================== */

const camera={
x:0,
y:0
};


/* =====================================================
   MAP
===================================================== */

const buildings=[];
const trees=[];
const rocks=[];
const crates=[];
const cars=[];
const bushes=[];
const roads=[];


/* roads */

roads.push({
x:0,
y:2350,
w:5000,
h:300
});

roads.push({
x:2350,
y:0,
w:300,
h:5000
});


/* buildings */

for(let i=0;i<65;i++){

let w=random(100,280);
let h=random(100,240);

let x=random(100,4900-w);
let y=random(100,4900-h);

buildings.push({
x,
y,
w,
h,
color:Math.random()>.5?"#353a3d":"#42484a"
});

}


/* trees */

for(let i=0;i<750;i++){

trees.push({
x:random(30,4970),
y:random(30,4970),
size:random(12,27)
});

}


/* rocks */

for(let i=0;i<250;i++){

rocks.push({
x:random(30,4970),
y:random(30,4970),
size:random(7,24)
});

}


/* crates */

for(let i=0;i<180;i++){

crates.push({
x:random(50,4950),
y:random(50,4950)
});

}


/* cars */

for(let i=0;i<80;i++){

cars.push({
x:random(100,4900),
y:random(100,4900),
angle:Math.random()*Math.PI*2
});

}


/* bushes */

for(let i=0;i<500;i++){

bushes.push({
x:random(20,4980),
y:random(20,4980),
size:random(8,18)
});

}


/* =====================================================
   ENEMIES
===================================================== */

const enemies=[];

for(let i=0;i<25;i++){

enemies.push({
x:random(300,4700),
y:random(300,4700),
angle:0,
hp:100,
cooldown:random(20,100),
alive:true
});

}


/* =====================================================
   BULLETS
===================================================== */

const bullets=[];


/* =====================================================
   ENEMY BULLETS
===================================================== */

const enemyBullets=[];


/* =====================================================
   RELOAD
===================================================== */

let reloading=false;

function reload(){

if(reloading)return;

if(player.ammo>=30)return;

if(player.reserve<=0)return;

reloading=true;

showMessage("RELOADING...");

setTimeout(()=>{

let needed=30-player.ammo;

let amount=Math.min(needed,player.reserve);

player.ammo+=amount;
player.reserve-=amount;

reloading=false;

hideMessage();

},1000);

}

document.getElementById("reload").addEventListener("click",reload);


/* =====================================================
   MESSAGE
===================================================== */

const message=document.getElementById("message");

function showMessage(text){

message.textContent=text;
message.style.opacity=1;

}

function hideMessage(){

message.style.opacity=0;

}


/* =====================================================
   SHOOT
===================================================== */

let lastShot=0;

function shoot(){

if(!player.alive)return;

if(reloading)return;

if(player.ammo<=0){

reload();

return;

}

let now=Date.now();

if(now-lastShot<120)return;

lastShot=now;

player.ammo--;

bullets.push({

x:player.x,
y:player.y,
angle:player.angle,
speed:17,
life:100

});

}


/* =====================================================
   COLLISION WITH BUILDINGS
===================================================== */

function insideBuilding(x,y){

for(const b of buildings){

if(
x>b.x &&
x<b.x+b.w &&
y>b.y &&
y<b.y+b.h
){

return b;

}

}

return null;

}


/* =====================================================
   DRAW WORLD
===================================================== */

function drawWorld(){

/* grass */

ctx.fillStyle="#65745a";

ctx.fillRect(
-camera.x,
-camera.y,
WORLD_WIDTH,
WORLD_HEIGHT
);


/* grass texture */

ctx.fillStyle="rgba(30,55,30,.25)";

for(let x=0;x<WORLD_WIDTH;x+=70){

for(let y=0;y<WORLD_HEIGHT;y+=70){

ctx.fillRect(
x-camera.x,
y-camera.y,
2,
2
);

}

}


/* roads */

ctx.fillStyle="#30363a";

for(const road of roads){

ctx.fillRect(
road.x-camera.x,
road.y-camera.y,
road.w,
road.h
);

}


/* road borders */

ctx.strokeStyle="#202326";
ctx.lineWidth=8;

for(const road of roads){

ctx.strokeRect(
road.x-camera.x,
road.y-camera.y,
road.w,
road.h
);

}


/* road lines */

ctx.strokeStyle="#d8bd52";
ctx.lineWidth=4;
ctx.setLineDash([35,35]);

ctx.beginPath();

ctx.moveTo(
0-camera.x,
2500-camera.y
);

ctx.lineTo(
5000-camera.x,
2500-camera.y
);

ctx.stroke();

ctx.beginPath();

ctx.moveTo(
2500-camera.x,
0-camera.y
);

ctx.lineTo(
2500-camera.x,
5000-camera.y
);

ctx.stroke();

ctx.setLineDash([]);


/* bushes */

for(const bush of bushes){

let x=bush.x-camera.x;
let y=bush.y-camera.y;

ctx.fillStyle="#294b2c";

ctx.beginPath();

ctx.arc(
x,
y,
bush.size,
0,
Math.PI*2
);

ctx.fill();

}


/* rocks */

for(const rock of rocks){

ctx.fillStyle="#646966";

ctx.beginPath();

ctx.arc(
rock.x-camera.x,
rock.y-camera.y,
rock.size,
0,
Math.PI*2
);

ctx.fill();

}


/* trees */

for(const tree of trees){

let x=tree.x-camera.x;
let y=tree.y-camera.y;

ctx.fillStyle="#513b29";

ctx.fillRect(
x-4,
y,
8,
tree.size
);

ctx.fillStyle="#204d2a";

ctx.beginPath();

ctx.arc(
x,
y,
tree.size,
0,
Math.PI*2
);

ctx.fill();

ctx.fillStyle="#34713c";

ctx.beginPath();

ctx.arc(
x-7,
y-7,
tree.size*.55,
0,
Math.PI*2
);

ctx.fill();

}


/* crates */

for(const crate of crates){

let x=crate.x-camera.x;
let y=crate.y-camera.y;

ctx.fillStyle="#a46e35";

ctx.fillRect(x,y,28,28);

ctx.strokeStyle="#543719";

ctx.lineWidth=2;

ctx.strokeRect(x,y,28,28);

}


/* cars */

for(const car of cars){

ctx.save();

ctx.translate(
car.x-camera.x,
car.y-camera.y
);

ctx.rotate(car.angle);

ctx.fillStyle="#22272b";

ctx.fillRect(-25,-12,50,24);

ctx.fillStyle="#15181a";

ctx.fillRect(-15,-9,25,18);

ctx.fillStyle="#111";

ctx.fillRect(-19,-15,10,5);
ctx.fillRect(10,-15,10,5);
ctx.fillRect(-19,10,10,5);
ctx.fillRect(10,10,10,5);

ctx.restore();

}


/* buildings */

for(const b of buildings){

let x=b.x-camera.x;
let y=b.y-camera.y;

ctx.fillStyle="rgba(0,0,0,.25)";

ctx.fillRect(
x+8,
y+10,
b.w,
b.h
);

ctx.fillStyle=b.color;

ctx.fillRect(
x,
y,
b.w,
b.h
);


/* roof */

ctx.fillStyle="#25292b";

ctx.fillRect(
x+7,
y+7,
b.w-14,
b.h-14
);


/* windows */

ctx.fillStyle="#9eb6b5";

for(let wx=b.x+25;wx<b.x+b.w-20;wx+=42){

for(let wy=b.y+25;wy<b.y+b.h-20;wy+=42){

ctx.fillRect(
wx-camera.x,
wy-camera.y,
13,
13
);

}

}


/* door */

ctx.fillStyle="#161718";

ctx.fillRect(
b.x+b.w/2-10-camera.x,
b.y+b.h-35-camera.y,
20,
35
);

}

}


/* =====================================================
   HUMAN CHARACTER
===================================================== */

function drawHuman(x,y,angle,color){

ctx.save();

ctx.translate(x,y);
ctx.rotate(angle);


/* shadow */

ctx.fillStyle="rgba(0,0,0,.4)";

ctx.beginPath();

ctx.ellipse(
0,
15,
19,
10,
0,
0,
Math.PI*2
);

ctx.fill();


/* legs */

ctx.fillStyle="#20252c";

ctx.fillRect(-10,5,7,19);
ctx.fillRect(3,5,7,19);


/* body */

ctx.fillStyle=color;

ctx.fillRect(
-13,
-10,
26,
25
);


/* vest */

ctx.fillStyle="rgba(0,0,0,.25)";

ctx.fillRect(
-8,
-8,
16,
21
);


/* arms */

ctx.fillStyle="#c99672";

ctx.fillRect(-19,-8,7,19);
ctx.fillRect(12,-8,7,19);


/* head */

ctx.fillStyle="#d5a27c";

ctx.beginPath();

ctx.arc(
0,
-22,
10,
0,
Math.PI*2
);

ctx.fill();


/* hair */

ctx.fillStyle="#202020";

ctx.beginPath();

ctx.arc(
0,
-25,
10,
Math.PI,
Math.PI*2
);

ctx.fill();


/* gun */

ctx.fillStyle="#151515";

ctx.fillRect(
10,
-4,
28,
6
);


/* gun muzzle */

ctx.fillStyle="#777";

ctx.fillRect(
37,
-5,
5,
8
);

ctx.restore();

}


/* =====================================================
   PLAYER
===================================================== */

function drawPlayer(){

drawHuman(
player.x-camera.x,
player.y-camera.y,
player.angle,
"#398cff"
);

}


/* =====================================================
   ENEMIES
===================================================== */

function drawEnemies(){

for(const enemy of enemies){

if(!enemy.alive)continue;

drawHuman(
enemy.x-camera.x,
enemy.y-camera.y,
enemy.angle,
"#d64048"
);

}

}


/* =====================================================
   BULLETS
===================================================== */

function drawBullets(){

ctx.fillStyle="#ffe66d";

for(const bullet of bullets){

ctx.beginPath();

ctx.arc(
bullet.x-camera.x,
bullet.y-camera.y,
4,
0,
Math.PI*2
);

ctx.fill();

}

ctx.fillStyle="#ff5757";

for(const bullet of enemyBullets){

ctx.beginPath();

ctx.arc(
bullet.x-camera.x,
bullet.y-camera.y,
4,
0,
Math.PI*2
);

ctx.fill();

}

}


/* =====================================================
   PLAYER UPDATE
===================================================== */

function updatePlayer(){

if(!player.alive)return;

let dx=0;
let dy=0;

if(keys["w"])dy--;
if(keys["s"])dy++;
if(keys["a"])dx--;
if(keys["d"])dx++;

if(dx||dy){

let len=Math.hypot(dx,dy);

dx/=len;
dy/=len;

let nx=player.x+dx*player.speed;
let ny=player.y+dy*player.speed;


/* building collision */

if(!insideBuilding(nx,player.y))
player.x=nx;

if(!insideBuilding(player.x,ny))
player.y=ny;

}

player.x=Math.max(30,Math.min(4970,player.x));
player.y=Math.max(30,Math.min(4970,player.y));


camera.x=player.x-canvas.width/2;
camera.y=player.y-canvas.height/2;

camera.x=Math.max(
0,
Math.min(
WORLD_WIDTH-canvas.width,
camera.x
)
);

camera.y=Math.max(
0,
Math.min(
WORLD_HEIGHT-canvas.height,
camera.y
)
);


player.angle=Math.atan2(
mouseY-canvas.height/2,
mouseX-canvas.width/2
);


if(mouseDown)
shoot();

}


/* =====================================================
   BULLET UPDATE
===================================================== */

function updateBullets(){

for(let i=bullets.length-1;i>=0;i--){

const bullet=bullets[i];

bullet.x+=Math.cos(bullet.angle)*bullet.speed;
bullet.y+=Math.sin(bullet.angle)*bullet.speed;

bullet.life--;


/* building collision */

if(insideBuilding(bullet.x,bullet.y)){

bullet.life=0;

}


/* enemy hit */

for(const enemy of enemies){

if(!enemy.alive)continue;

if(
distance(
bullet.x,
bullet.y,
enemy.x,
enemy.y
)<22
){

enemy.hp-=50;

bullet.life=0;

if(enemy.hp<=0){

enemy.alive=false;

}

break;

}

}


if(bullet.life<=0){

bullets.splice(i,1);

}

}

}


/* =====================================================
   ENEMY AI
===================================================== */

function updateEnemies(){

for(const enemy of enemies){

if(!enemy.alive)continue;

const dx=player.x-enemy.x;
const dy=player.y-enemy.y;

const dist=Math.hypot(dx,dy);

enemy.angle=Math.atan2(dy,dx);


/* move toward player */

if(dist>350){

let nx=enemy.x+Math.cos(enemy.angle)*.65;
let ny=enemy.y+Math.sin(enemy.angle)*.65;

if(!insideBuilding(nx,enemy.y))
enemy.x=nx;

if(!insideBuilding(enemy.x,ny))
enemy.y=ny;

}


/* shoot */

enemy.cooldown--;

if(
dist<800 &&
enemy.cooldown<=0
){

enemyBullets.push({

x:enemy.x,
y:enemy.y,
angle:enemy.angle,
speed:7,
life:130

});

enemy.cooldown=random(70,130);

}

}

}


/* =====================================================
   ENEMY BULLETS
===================================================== */

function updateEnemyBullets(){

for(let i=enemyBullets.length-1;i>=0;i--){

const bullet=enemyBullets[i];

bullet.x+=Math.cos(bullet.angle)*bullet.speed;
bullet.y+=Math.sin(bullet.angle)*bullet.speed;

bullet.life--;


if(insideBuilding(bullet.x,bullet.y)){

bullet.life=0;

}


if(
distance(
bullet.x,
bullet.y,
player.x,
player.y
)<18
){

player.hp-=10;

bullet.life=0;

if(player.hp<=0){

player.hp=0;
player.alive=false;

showMessage("YOU DIED");

}

}


if(bullet.life<=0){

enemyBullets.splice(i,1);

}

}

}


/* =====================================================
   MINIMAP
===================================================== */

function drawMinimap(){

mini.clearRect(0,0,190,190);

mini.fillStyle="#53664a";

mini.fillRect(0,0,190,190);


/* roads */

mini.fillStyle="#30363a";

mini.fillRect(0,89,190,12);
mini.fillRect(89,0,12,190);


/* buildings */

mini.fillStyle="#25292a";

for(const b of buildings){

mini.fillRect(
b.x/WORLD_WIDTH*190,
b.y/WORLD_HEIGHT*190,
b.w/WORLD_WIDTH*190,
b.h/WORLD_HEIGHT*190
);

}


/* enemies */

mini.fillStyle="#ff4141";

for(const enemy of enemies){

if(!enemy.alive)continue;

mini.fillRect(
enemy.x/WORLD_WIDTH*190-2,
enemy.y/WORLD_HEIGHT*190-2,
4,
4
);

}


/* player */

mini.fillStyle="#40a0ff";

mini.beginPath();

mini.arc(
player.x/WORLD_WIDTH*190,
player.y/WORLD_HEIGHT*190,
5,
0,
Math.PI*2
);

mini.fill();

}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

document.getElementById("healthBar").style.width=
player.hp+"%";

document.getElementById("healthText").textContent=
Math.ceil(player.hp)+" HP";

document.getElementById("ammo").textContent=
player.ammo+" / "+player.reserve;

}


/* =====================================================
   GAME LOOP
===================================================== */

let gameStarted=false;

function gameLoop(){

if(gameStarted){

updatePlayer();
updateBullets();
updateEnemies();
updateEnemyBullets();

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

drawWorld();
drawBullets();
drawEnemies();
drawPlayer();

drawMinimap();
updateHUD();

}

requestAnimationFrame(gameLoop);

}


/* =====================================================
   START
===================================================== */

document.getElementById("startButton").addEventListener(
"click",
()=>{

gameStarted=true;

document.getElementById("startScreen").style.display="none";

}
);


gameLoop();

</script>

</body>
</html>
